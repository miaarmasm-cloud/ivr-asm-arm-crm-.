; =========================================================================
; CONFIGURACIÓN MODERNA PJSIP (ASTERISK 20 LTS)
; Soporta Softphones de prueba (UDP), WebSockets para el CRM (WSS/WS) 
; y preparado para Troncal SIP PSTN
; =========================================================================

[global]
type=global
user_agent=Asterisk-20-ARM-PBX

; -------------------------------------------------------------------------
; 1. TRANSPORTES DE RED (UDP para Softphones, WS para CRM WebRTC)
; -------------------------------------------------------------------------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088 ; Puerto WebRTC sin cifrar para pruebas internas o reverse-proxy

; -------------------------------------------------------------------------
; 2. PLANTILLA BASE DE ENDPOINTS (Códecs y opciones de audio)
; -------------------------------------------------------------------------
[endpoint-template](!)
type=endpoint
context=from-internal
disallow=all
allow=opus
allow=g729
allow=ulaw
allow=alaw
allow=h264
allow=vp8
dtmf_mode=rfc4733
direct_media=no
ice_support=yes
use_avpf=yes
media_encryption=no ; Se activa DTLS si se conecta directo por WSS sin proxy
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes

; -------------------------------------------------------------------------
; 3. EXTENSIÓN SOFTPHONE DE PRUEBA: 1001 (Cliente que llama)
; -------------------------------------------------------------------------
[1001](endpoint-template)
auth=auth-1001
aors=aor-1001

[auth-1001]
type=auth
auth_type=userpass
username=1001
password=PruebaPass1001!

[aor-1001]
type=aor
max_contacts=3
remove_existing=yes

; -------------------------------------------------------------------------
; 4. EXTENSIÓN WEBRTC PARA EL CRM: 2001 (Agente en navegador Next.js)
; -------------------------------------------------------------------------
[2001](endpoint-template)
auth=auth-2001
aors=aor-2001
webrtc=yes
dtls_auto_generate_cert=yes

[auth-2001]
type=auth
auth_type=userpass
username=2001
password=AgenteWebPass2001!

[aor-2001]
type=aor
max_contacts=5
remove_existing=yes

