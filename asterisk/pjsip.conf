; =========================================================================
; CONFIGURACIÓN MODERNA PJSIP (ASTERISK 20 LTS)
; Arquitectura Homologada de Campañas Segmentadas con DIDs Virtuales
; -------------------------------------------------------------------------
; Campaña 1: Saldo y Finanzas (DID Virtual 1000) -> Exts 1001-1004
; Campaña 2: Retención y Cancelaciones (DID Virtual 2000) -> Exts 2001-2004
; Campaña 3: Ventas y Nuevos Contratos (DID Virtual 3000) -> Exts 3001-3004
; Campaña 4: Doctores & Consultas Médicas IA (DID Virtual 4000) -> Exts 4001-4005
; -------------------------------------------------------------------------
; Anti-Ghosting, Session Timers (RFC 4028) y Soporte Universal SIP / WebRTC
; =========================================================================

[global]
type=global
user_agent=Asterisk-20-ARM-PBX

; -------------------------------------------------------------------------
; 1. TRANSPORTES DE RED (UDP/TCP Softphones, WS para CRM WebRTC)
; -------------------------------------------------------------------------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=192.168.216.0/24
local_net=127.0.0.1/32

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060
local_net=192.168.216.0/24
local_net=127.0.0.1/32

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088 ; Puerto WebRTC sin cifrar para pruebas internas o reverse-proxy
local_net=192.168.216.0/24
local_net=127.0.0.1/32

; -------------------------------------------------------------------------
; 2. PLANTILLA BASE DE ENDPOINTS (Códecs, WebRTC y Anti-Ghost)
; -------------------------------------------------------------------------
[endpoint-template](!)
type=endpoint
context=from-internal
disallow=all
allow=ulaw
allow=alaw
allow=opus
allow=g729
allow=h264
allow=vp8
dtmf_mode=rfc4733
direct_media=no
ice_support=no
use_avpf=no
media_encryption=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
webrtc=yes
dtls_auto_generate_cert=yes
; Protección Antifantasmas / Canales Zombi (Mejores Prácticas Asterisk 20)
rtp_timeout=30
rtp_timeout_hold=120
timers=yes
timers_min_se=90
timers_sess_expires=120

; -------------------------------------------------------------------------
; 2.1 TRONCAL PSTN / SIP GATEWAY (Anti-Ghost y Session Timers)
; -------------------------------------------------------------------------
[trunk-pstn-endpoint](endpoint-template)
context=from-trunk


; =========================================================================
; 3. CAMPAÑA 1: ATENCIÓN A CLIENTES & FINANZAS (DID VIRTUAL 1000)
; Agentes asignados a Saldo, Finanzas y Consultas de Tarjeta (Opción 1)
; =========================================================================

; Extensión 1001: Agente Finanzas 1 (Juan Pérez)
[1001](endpoint-template)
auth=auth-1001
aors=1001

[auth-1001]
type=auth
auth_type=userpass
username=1001
password=FinanzasPass1001!

[1001]
type=aor
max_contacts=5
remove_existing=yes

