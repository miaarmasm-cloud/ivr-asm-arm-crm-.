; =========================================================================
; DIALPLAN MODERNO ASTERISK 20 LTS: extensions.conf
; Sistema IVR / ARM / CRM con soporte puro SIP (G.729, G.711, Opus, H.264)
; =========================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
TIMEOUT_DIGITOS=5
TIMEOUT_RESPUESTA=10
EXT_AGENTE_HUMANO=2001

; =========================================================================
; CONTEXTO 1: [from-internal] - Punto de entrada para Softphones (ej. 1001)
; =========================================================================
[from-internal]
; Si el cliente marca al conmutador IVR (8000) o a cualquier número general
exten => 8000,1,NoOp(>>> INICIO DE LLAMADA ENTRANTE AL IVR: ${CALLERID(all)} <<<)
 same => n,Answer(500)
 same => n,Goto(menu-ivr-principal,s,1)

; Llamadas directas entre extensiones registradas (ej. 1001 a 2001)
exten => _[1-2]XXX,1,NoOp(>>> LLAMADA INTERNA DIRECTA DE ${CALLERID(num)} A ${EXTEN} <<<)
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; Comodín: Cualquier número marcado redirige al IVR
exten => _X.,1,Goto(from-internal,8000,1)


; =========================================================================
; CONTEXTO 2: [menu-ivr-principal] - Menú interactivo con 3 opciones
; =========================================================================
[menu-ivr-principal]
exten => s,1,NoOp(>>> PRESENTANDO MENU IVR PRINCIPAL A ${CALLERID(num)} <<<)
 same => n,Set(TIMEOUT(digit)=${TIMEOUT_DIGITOS})
 same => n,Set(TIMEOUT(response)=${TIMEOUT_RESPUESTA})
 ; Locución de bienvenida y menú de opciones:
 ; "Bienvenido al sistema inteligente ARM. Marque 1 para saldo, 2 para cancelación, 3 para ventas"
 same => n(reproducir),Background(ivr-bienvenida-menu)
 same => n,WaitExten(${TIMEOUT_RESPUESTA})

; -------------------------------------------------------------------------
; OPCIÓN 1: CONSULTA DE SALDO
; -------------------------------------------------------------------------
exten => 1,1,NoOp(>>> OPCION 1 SELECCIONADA: CONSULTA DE SALDO PARA ${CALLERID(num)} <<<)
 same => n,Goto(ivr-opcion-saldo,s,1)

; -------------------------------------------------------------------------
; OPCIÓN 2: CANCELACIÓN
; -------------------------------------------------------------------------
exten => 2,1,NoOp(>>> OPCION 2 SELECCIONADA: CANCELACION PARA ${CALLERID(num)} <<<)
 same => n,Goto(ivr-opcion-cancelacion,s,1)

; -------------------------------------------------------------------------
; OPCIÓN 3: VENTAS Y TRANSFERENCIA A AGENTE HUMANO
; -------------------------------------------------------------------------
exten => 3,1,NoOp(>>> OPCION 3 SELECCIONADA: VENTAS / TRANSFERENCIA A AGENTE <<<)
 same => n,Goto(ivr-opcion-ventas-agente,s,1)

; -------------------------------------------------------------------------
; MANEJO DE ENTRADAS INVÁLIDAS Y TIMEOUT (REINTENTO)
; -------------------------------------------------------------------------
exten => i,1,NoOp(>>> TECLA INVALIDA PULSADA POR ${CALLERID(num)} <<<)
 same => n,Playback(opcion-invalida)
 same => n,Goto(s,reproducir)

exten => t,1,NoOp(>>> TIMEOUT: NO SE DETECTARON DIGITOS <<<)
 same => n,Playback(tiempo-agotado-transfiriendo)
 same => n,Goto(ivr-opcion-ventas-agente,s,1)


; =========================================================================
; CONTEXTO 3: [ivr-opcion-saldo] - Consulta de Saldo por CallerID
; =========================================================================
[ivr-opcion-saldo]
exten => s,1,NoOp(>>> CONSULTANDO SALDO EN BASE DE DATOS PARA CALLER_ID: ${CALLERID(num)} <<<)
 ; Conecta con el Middleware o Stasis ARI para consultar Supabase
 same => n,Playback(consultando-su-saldo)
 same => n,Stasis(arm_crm_middleware,saldo,${CALLERID(num)})
 same => n,Wait(1)
 same => n,Hangup()


; =========================================================================
; CONTEXTO 4: [ivr-opcion-cancelacion] - Cancelaciones
; =========================================================================
[ivr-opcion-cancelacion]
exten => s,1,NoOp(>>> GESTION DE CANCELACION PARA CALLER_ID: ${CALLERID(num)} <<<)
 same => n,Playback(aviso-departamento-cancelaciones)
 same => n,Stasis(arm_crm_middleware,cancelacion,${CALLERID(num)})
 same => n,Wait(1)
 same => n,Hangup()


; =========================================================================
; CONTEXTO 5: [ivr-opcion-ventas-agente] - Transferencia Asistida a Humano
; =========================================================================
[ivr-opcion-ventas-agente]
exten => s,1,NoOp(>>> TRANSFERENCIA ASISTIDA (WARM TRANSFER) A EXTENSION ${EXT_AGENTE_HUMANO} <<<)
 same => n,Playback(transfiriendo-con-un-ejecutivo)
 ; Timbra en la extensión WebRTC del CRM (Mariana Gómez - 2001) durante 30 segundos
 same => n,Dial(PJSIP/${EXT_AGENTE_HUMANO},30,tT)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?ocupado:no_responde)

 same => n(ocupado),Playback(agentes-ocupados-intente-mas-tarde)
 same => n,Hangup()

 same => n(no_responde),Playback(agentes-no-disponibles)
 same => n,Hangup()


; =========================================================================
; CONTEXTO 6: [from-trunk] - Llamadas entrantes desde Troncal PSTN
; =========================================================================
[from-trunk]
exten => _.,1,NoOp(>>> LLAMADA ENTRANTE EXTERNA DESDE PSTN: ${CALLERID(all)} <<<)
 same => n,Goto(from-internal,8000,1)
