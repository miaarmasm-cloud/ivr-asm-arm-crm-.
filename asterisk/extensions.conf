; =========================================================================
; DIALPLAN MODERNO ASTERISK 20 LTS: extensions.conf
; Arquitectura de Campañas con DIDs Virtuales y Agrupación Jerárquica
; Cabeceras Fijas IVR: 8000, 8009990000, 5550001000
; DIDs Virtuales de Campaña: 1000 (Saldo), 2000 (Cancelaciones), 3000 (Ventas), 4000 (Doctores)
; Extensiones: 1001-1002 (Saldo), 2001-2002 (Cancelaciones), 3001-3002 (Ventas), 4001-4003 (Doctores)
; Homologación Universal de UUID v4 (ADN de Llamada) en Inbound y Outbound
; Manejo Estricto de Hangup Handlers (Anti-Ghost / Anti-Zombie Channels)
; =========================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
TIMEOUT_DIGITOS=5
TIMEOUT_RESPUESTA=10
CABECERA_IVR=8000
DID_CAMPANA_SALDO=1000
DID_CAMPANA_CANCELACIONES=2000
DID_CAMPANA_VENTAS=3000
DID_CAMPANA_DOCTORES=4000

; =========================================================================
; CONTEXTO 1: [from-internal] - Punto de entrada Softphones, DIDs y CRM
; =========================================================================
[from-internal]

; -------------------------------------------------------------------------
; 1. NÚMEROS DE CABECERA GENERAL IVR (FIJOS DEL CONMUTADOR)
; Números centrales inmutables donde ingresan todas las llamadas públicas
; -------------------------------------------------------------------------
exten => 8000,1,NoOp(>>> [CABECERA-IVR 8000] Entrada Conmutador Principal: ${CALLERID(all)} <<<)
 same => n,Set(CHANNEL(hangup_handler_push)=sub-limpieza-canal,s,1)
 same => n,Set(DID_DESTINO=8000)
 same => n,Set(ENRUTAR_DIRECTO=)
 same => n,Answer(500)
 same => n,Goto(menu-ivr-principal,s,1)

exten => 8009990000,1,NoOp(>>> [CABECERA-PSTN 8009990000] Entrada Pública al IVR: ${CALLERID(all)} <<<)
 same => n,Set(CHANNEL(hangup_handler_push)=sub-limpieza-canal,s,1)
 same => n,Set(DID_DESTINO=8000)
 same => n,Set(ENRUTAR_DIRECTO=)
 same => n,Answer(500)
 same => n,Goto(menu-ivr-principal,s,1)

exten => 5550001000,1,NoOp(>>> [CABECERA-PSTN 5550001000] Entrada Pública al IVR: ${CALLERID(all)} <<<)
 same => n,Set(CHANNEL(hangup_handler_push)=sub-limpieza-canal,s,1)
 same => n,Set(DID_DESTINO=8000)
 same => n,Set(ENRUTAR_DIRECTO=)
 same => n,Answer(500)
 same => n,Goto(menu-ivr-principal,s,1)

; -------------------------------------------------------------------------
; 1.1 SIMULADOR DE ENTRADA PSTN PACIENTE / CLIENTE EXTERNO
; Marcación desde Softphone Zoiper: 77 + Teléfono a 10 dígitos (ej. 7711100921)
; Inyecta el CallerID para prueba, se conecta a la Cabecera 8000 y bifurca según historial
; -------------------------------------------------------------------------
exten => _77[0-9+].!,1,NoOp(>>> [SIMULADOR-PSTN] Marcando desde Softphone: ${EXTEN} hacia IVR 8000 <<<)
 same => n,Set(CHANNEL(hangup_handler_push)=sub-limpieza-canal,s,1)
 same => n,Set(CALLERID(num)=${EXTEN})
 same => n,Set(CALLERID(name)=PSTN-${EXTEN})
 same => n,Set(DID_DESTINO=8000)
 same => n,Set(ENRUTAR_DIRECTO=)
 same => n,Answer(500)
 same => n,Goto(menu-ivr-principal,s,1)

; Acceso directo si se marca el número simulado 11100921 sin el 77
exten => 11100921,1,Goto(from-internal,7711100921,1)

; -------------------------------------------------------------------------
; 2. DIDs VIRTUALES DE CAMPAÑA (Enrutamiento Inbound Segmentado 1000, 2000, 3000, 4000)
; Generan UUID (ADN), inician MixMonitor y enrutan de forma directa a su campaña
; -------------------------------------------------------------------------
exten => 1000,1,NoOp(>>> [DID-VIRTUAL 1000] Entrada Inbound a Campaña Consulta de Saldo y Finanzas <<<)
 same => n,Set(CHANNEL(hangup_handler_push)=sub-limpieza-canal,s,1)
 same => n,Set(DID_DESTINO=1000)
 same => n,Answer(500)
 same => n,Goto(menu-ivr-principal,s,1)

exten => 2000,1,NoOp(>>> [DID-VIRTUAL 2000] Entrada Inbound a Campaña Retención y Cancelaciones ARM <<<)
 same => n,Set(CHANNEL(hangup_handler_push)=sub-limpieza-canal,s,1)
 same => n,Set(DID_DESTINO=2000)
 same => n,Answer(500)
 same => n,Goto(menu-ivr-principal,s,1)

exten => 3000,1,NoOp(>>> [DID-VIRTUAL 3000] Entrada Inbound a Campaña Ventas y Nuevos Contratos <<<)
 same => n,Set(CHANNEL(hangup_handler_push)=sub-limpieza-canal,s,1)
 same => n,Set(DID_DESTINO=3000)
 same => n,Answer(500)
 same => n,Goto(menu-ivr-principal,s,1)

exten => 4000,1,NoOp(>>> [DID-VIRTUAL 4000] Entrada Inbound a Campaña Doctores y Consultas Médicas IA <<<)
 same => n,Set(CHANNEL(hangup_handler_push)=sub-limpieza-canal,s,1)
 same => n,Set(DID_DESTINO=4000)
 same => n,Answer(500)
 same => n,Goto(menu-ivr-principal,s,1)

; Compatibilidad con DIDs anteriores
exten => 8002,1,Goto(from-internal,2000,1)
exten => 8003,1,Goto(from-internal,3000,1)
exten => 8004,1,Goto(from-internal,4000,1)

; -------------------------------------------------------------------------
; 3. LLAMADAS SALIENTES INTER-EXTENSIONES (1XXX, 2XXX, 3XXX, 4XXX)
; - Abre canal y genera UUID v4 único e irrepetible (ADN)
; - Inicia grabación homologada rec_${CALL_UUID}.wav con MixMonitor
; - Registra en Supabase llamadas_bitacora como 'saliente' / 'en_curso'
; - Vincula Hangup Handler a Pata A y Pata B (Anti-Canales Fantasmas)
; -------------------------------------------------------------------------
exten => _[1-4]XXX,1,NoOp(>>> [OUTBOUND-INTERNO] Marcando Extensión: ${EXTEN} desde ${CALLERID(all)} <<<)
 same => n,Set(CHANNEL(hangup_handler_push)=sub-limpieza-canal,s,1)
 same => n,Set(ORIGEN_EXT=${CALLERID(num)})
 ; Determinar DID Virtual y Campaña según la extensión de origen
 same => n,Set(EXT_PREFIX=${ORIGEN_EXT:0:1})
 same => n,ExecIf($["${EXT_PREFIX}" = "1"]?Set(CAMPANA_NOMBRE=atencion_clientes))
 same => n,ExecIf($["${EXT_PREFIX}" = "1"]?Set(DID_VIRTUAL=1000))
 same => n,ExecIf($["${EXT_PREFIX}" = "2"]?Set(CAMPANA_NOMBRE=cancelaciones))
 same => n,ExecIf($["${EXT_PREFIX}" = "2"]?Set(DID_VIRTUAL=2000))
 same => n,ExecIf($["${EXT_PREFIX}" = "3"]?Set(CAMPANA_NOMBRE=ventas))
 same => n,ExecIf($["${EXT_PREFIX}" = "3"]?Set(DID_VIRTUAL=3000))
 same => n,ExecIf($["${EXT_PREFIX}" = "4"]?Set(CAMPANA_NOMBRE=doctores))
 same => n,ExecIf($["${EXT_PREFIX}" = "4"]?Set(DID_VIRTUAL=4000))
 ; Generar UUID (ADN) de llamada si no viene heredado o asignado por API
 same => n,GotoIf($["${CALL_UUID}" != ""]?iniciar_grabacion_int)
 same => n,Set(__CALL_UUID=${SHELL(cat /proc/sys/kernel/random/uuid 2>/dev/null || echo call-int-${EPOCH})})
 same => n,Set(__CALL_UUID=${FILTER(a-zA-Z0-9-,${CALL_UUID})})
 same => n(iniciar_grabacion_int),NoOp(>>> ADN Llamada Inter-Extensiones: ${CALL_UUID} (${ORIGEN_EXT} -> ${EXTEN}) <<<)
 same => n,MixMonitor(/var/spool/asterisk/monitor/rec_${CALL_UUID}.wav,b)
 ; Registrar en Supabase llamadas_bitacora (Sincrónico con timeout 2s para garantizar persistencia)
 same => n,System(curl -s -m 2 -X POST "https://xlmrmdxtrdomtrmnczwh.supabase.co/rest/v1/llamadas_bitacora" -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhsbXJtZHh0cmRvbXRybW5jendoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2MDcyMTEsImV4cCI6MjExMDE4MzIxMX0.Gcv0Rw0242xQtyultJjjAJclpxc4xHeAZHXU3BDdhXk" -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhsbXJtZHh0cmRvbXRybW5jendoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2MDcyMTEsImV4cCI6MjExMDE4MzIxMX0.Gcv0Rw0242xQtyultJjjAJclpxc4xHeAZHXU3BDdhXk" -H "Content-Type: application/json" -d '{"id":"${CALL_UUID}","caller_id":"${ORIGEN_EXT}","did_marcado":"${EXTEN}","tipo":"saliente","estado":"en_curso","campana":"${CAMPANA_NOMBRE}","opcion_ivr_seleccionada":"Llamada Inter-Extensiones","grabacion_url":"/var/spool/asterisk/monitor/rec_${CALL_UUID}.wav","extension_agente":"${ORIGEN_EXT}"}' > /dev/null 2>&1)
 ; Marcar destino vinculando Hangup Handler a Pata B (b(sub-pre-dial^s^1))
 same => n,Dial(PJSIP/${EXTEN},30,tTgb(sub-pre-dial^s^1))
 same => n,NoOp(>>> [FIN-DIAL-INTERNO] Exten: ${EXTEN}, DIALSTATUS: ${DIALSTATUS} <<<)
 same => n,Hangup()

; -------------------------------------------------------------------------
; 4. REGLA SALIENTE UNIVERSAL: OUTBOUND HACIA PSTN DESDE EXTENSIONES DE CAMPAÑA
; - Aplica a números externos de 5 o más dígitos (ej. 10 dígitos nacionales o E.164 +52...)
; - Asocia la llamada al DID Virtual de la campaña (1000, 2000, 3000, 4000)
; - Fija el CallerID de salida al número de cabecera fija 8000
; - Asigna CallerID Name identificador: ARM-${DID_VIRTUAL}-${ORIGEN_EXT}
; - Genera UUID v4 (ADN de llamada) y graba la llamada en /var/spool/asterisk/monitor/
; - Vincula Hangup Handler y Anti-Ghost en ambas patas de la llamada
; -------------------------------------------------------------------------
exten => _[1-9]XXXX.!,1,NoOp(>>> [OUTBOUND-PSTN] Destino: ${EXTEN} desde Agente: ${CALLERID(all)} <<<)
 same => n,Set(CHANNEL(hangup_handler_push)=sub-limpieza-canal,s,1)
 same => n,Set(ORIGEN_EXT=${CALLERID(num)})
 ; Determinar DID Virtual y Campaña según el rango de la extensión
 same => n,Set(EXT_PREFIX=${ORIGEN_EXT:0:1})
 same => n,ExecIf($["${EXT_PREFIX}" = "1"]?Set(CAMPANA_NOMBRE=atencion_clientes))
 same => n,ExecIf($["${EXT_PREFIX}" = "1"]?Set(DID_VIRTUAL=1000))
 same => n,ExecIf($["${EXT_PREFIX}" = "2"]?Set(CAMPANA_NOMBRE=cancelaciones))
 same => n,ExecIf($["${EXT_PREFIX}" = "2"]?Set(DID_VIRTUAL=2000))
 same => n,ExecIf($["${EXT_PREFIX}" = "3"]?Set(CAMPANA_NOMBRE=ventas))
 same => n,ExecIf($["${EXT_PREFIX}" = "3"]?Set(DID_VIRTUAL=3000))
 same => n,ExecIf($["${EXT_PREFIX}" = "4"]?Set(CAMPANA_NOMBRE=doctores))
 same => n,ExecIf($["${EXT_PREFIX}" = "4"]?Set(DID_VIRTUAL=4000))
 ; Asignar CallerID de Cabecera Fijo 8000 para salida externa hacia la PSTN
 same => n,Set(CALLERID(num)=8000)
 same => n,Set(CALLERID(name)=ARM-${DID_VIRTUAL}-${ORIGEN_EXT})
 ; Generar UUID (ADN) de llamada si no viene asignado por API
 same => n,GotoIf($["${CALL_UUID}" != ""]?iniciar_grabacion_out)
 same => n,Set(__CALL_UUID=${SHELL(cat /proc/sys/kernel/random/uuid 2>/dev/null || echo call-out-${EPOCH})})
 same => n,Set(__CALL_UUID=${FILTER(a-zA-Z0-9-,${CALL_UUID})})
 same => n(iniciar_grabacion_out),NoOp(>>> ADN de Llamada Saliente: ${CALL_UUID} (Campaña: ${CAMPANA_NOMBRE}, DID: ${DID_VIRTUAL}) <<<)
 same => n,MixMonitor(/var/spool/asterisk/monitor/rec_${CALL_UUID}.wav,b)
 ; Sincronizar registro saliente en Supabase llamadas_bitacora (Sincrónico con timeout 2s)
 same => n,System(curl -s -m 2 -X POST "https://xlmrmdxtrdomtrmnczwh.supabase.co/rest/v1/llamadas_bitacora" -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhsbXJtZHh0cmRvbXRybW5jendoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2MDcyMTEsImV4cCI6MjExMDE4MzIxMX0.Gcv0Rw0242xQtyultJjjAJclpxc4xHeAZHXU3BDdhXk" -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhsbXJtZHh0cmRvbXRybW5jendoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2MDcyMTEsImV4cCI6MjExMDE4MzIxMX0.Gcv0Rw0242xQtyultJjjAJclpxc4xHeAZHXU3BDdhXk" -H "Content-Type: application/json" -d '{"id":"${CALL_UUID}","caller_id":"${ORIGEN_EXT}","did_marcado":"${EXTEN}","tipo":"saliente","estado":"en_curso","campana":"${CAMPANA_NOMBRE}","opcion_ivr_seleccionada":"Outbound PSTN","grabacion_url":"/var/spool/asterisk/monitor/rec_${CALL_UUID}.wav","extension_agente":"${ORIGEN_EXT}"}' > /dev/null 2>&1)
 ; Enrutamiento: si es endpoint PJSIP interno o enlace externo PSTN
 same => n,GotoIf($["${PJSIP_ENDPOINT(${EXTEN},auth)}" != ""]?marcar_pjsip_dinamico)
 same => n,NoOp(>>> [OUTBOUND-PSTN-ENLACE] Transmitiendo llamada saliente hacia: ${EXTEN} con CallerID Cabecera 8000 <<<)
 same => n,Progress()
 same => n,Ringing()
 same => n,Wait(1)
 same => n,Answer()
 same => n,Playback(beep)
 same => n,Wait(3600)
 same => n,Hangup()
 same => n(marcar_pjsip_dinamico),Dial(PJSIP/${EXTEN},30,tTgb(sub-pre-dial^s^1))
 same => n,Hangup()

; Soporte E.164 con signo más (+52...)
exten => _+[0-9].,1,Goto(from-internal,${EXTEN:1},1)

exten => h,1,NoOp(>>> [HANGUP from-internal] Liberando canal: ${CHANNEL} (UUID: ${CALL_UUID}) <<<)
 same => n,Hangup()


; =========================================================================
; SUBRUTINA: [sub-pre-dial] - Enlace de Hangup Handler a Pata B (Callee)
; Se ejecuta en el canal saliente antes de que empiece a timbrar
; =========================================================================
[sub-pre-dial]
exten => s,1,NoOp(>>> [PRE-DIAL] Vinculando Hangup Handler a Pata B: ${CHANNEL} (UUID: ${CALL_UUID}) <<<)
 same => n,Set(CHANNEL(hangup_handler_push)=sub-limpieza-canal,s,1)
 same => n,Return()


; =========================================================================
; SUBRUTINA: [sub-limpieza-canal] - Depuración, Grabación y Sincronización
; Invocado de forma determinística en CUALQUIER terminación (Inbound, Outbound, Transfer)
; =========================================================================
[sub-limpieza-canal]
exten => s,1,NoOp(>>> [SUB-LIMPIEZA] Depurando y liberando canal: ${CHANNEL} (UUID: ${CALL_UUID}) <<<)
 same => n,NoOp(>>> Causa Fin: HANGUPCAUSE=${HANGUPCAUSE}, DIALSTATUS=${DIALSTATUS}, BILLSEC=${CDR(billsec)}s, DURATION=${CDR(duration)}s <<<)
 ; Detener grabación inmediatamente para vaciar buffers a disco
 same => n,StopMixMonitor()
 same => n,Set(CHANNEL_DEPURADO=1)
 same => n,GotoIf($["${CALL_UUID}" = ""]?fin_sub)
 ; Calcular duración de conversación o duración total de intento
 same => n,Set(DUR_FINAL=${CDR(billsec)})
 same => n,ExecIf($["${DUR_FINAL}" = "" | "${DUR_FINAL}" = "0"]?Set(DUR_FINAL=${CDR(duration)}))
 same => n,ExecIf($["${DUR_FINAL}" = ""]?Set(DUR_FINAL=0))
 ; Sincronizar estado finalizado y duración en Supabase
 same => n,System(curl -s -m 3 -X PATCH "https://xlmrmdxtrdomtrmnczwh.supabase.co/rest/v1/llamadas_bitacora?id=eq.${CALL_UUID}" -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhsbXJtZHh0cmRvbXRybW5jendoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2MDcyMTEsImV4cCI6MjExMDE4MzIxMX0.Gcv0Rw0242xQtyultJjjAJclpxc4xHeAZHXU3BDdhXk" -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhsbXJtZHh0cmRvbXRybW5jendoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2MDcyMTEsImV4cCI6MjExMDE4MzIxMX0.Gcv0Rw0242xQtyultJjjAJclpxc4xHeAZHXU3BDdhXk" -H "Content-Type: application/json" -d '{"estado":"finalizada","duracion_segundos":${DUR_FINAL}}' > /dev/null 2>&1)
 same => n(fin_sub),Return()


; =========================================================================
; CONTEXTO 2: [menu-ivr-principal] - Identificación, ADN Único y Campaña
; =========================================================================
[menu-ivr-principal]
exten => s,1,NoOp(>>> CLASIFICANDO LLAMANTE ENTRANTE: CallerID=${CALLERID(num)}, DID=${DID_DESTINO} <<<)
 same => n,Set(CHANNEL(hangup_handler_push)=sub-limpieza-canal,s,1)
 same => n,Set(TIMEOUT(digit)=${TIMEOUT_DIGITOS})
 same => n,Set(TIMEOUT(response)=${TIMEOUT_RESPUESTA})
 ; Microservicio AGI: Genera UUID (ADN), identifica Campaña por DID y saluda
 same => n(reproducir),AGI(/var/lib/asterisk/agi-bin/identificar_llamante_rest.py,${CALLERID(num)},${DID_DESTINO})
 ; Enrutamiento directo si la campaña lo exige (Doctores -> 4, Ventas -> 3, Cancelación -> 2, Saldo -> 1)
 same => n,GotoIf($["${ENRUTAR_DIRECTO}" = "4"]?ivr-opcion-citas,s,1)
 same => n,GotoIf($["${ENRUTAR_DIRECTO}" = "3"]?ivr-opcion-ventas-agente,s,1)
 same => n,GotoIf($["${ENRUTAR_DIRECTO}" = "2"]?ivr-opcion-cancelacion,s,1)
 same => n,GotoIf($["${ENRUTAR_DIRECTO}" = "1"]?ivr-opcion-saldo,s,1)
 same => n,WaitExten(${TIMEOUT_RESPUESTA})

; -------------------------------------------------------------------------
; OPCIÓN 1: CONSULTA DE SALDO (DID 1000 -> Agentes 1001, 1002)
; -------------------------------------------------------------------------
exten => 1,1,NoOp(>>> OPCION 1 SELECCIONADA: CONSULTA DE SALDO PARA ${CALLERID(num)} <<<)
 same => n,Goto(ivr-opcion-saldo,s,1)

; -------------------------------------------------------------------------
; OPCIÓN 2: CANCELACIÓN (DID 2000 -> Agentes 2001, 2002)
; -------------------------------------------------------------------------
exten => 2,1,NoOp(>>> OPCION 2 SELECCIONADA: CANCELACION PARA ${CALLERID(num)} <<<)
 same => n,Goto(ivr-opcion-cancelacion,s,1)

; -------------------------------------------------------------------------
; OPCIÓN 3: VENTAS Y TRANSFERENCIA A AGENTE COMERCIAL (DID 3000 -> Agentes 3001, 3002)
; -------------------------------------------------------------------------
exten => 3,1,NoOp(>>> OPCION 3 SELECCIONADA: VENTAS / ASESOR COMERCIAL <<<)
 same => n,Goto(ivr-opcion-ventas-agente,s,1)

; -------------------------------------------------------------------------
; OPCIÓN 4: AGENTE INTELIGENTE DE CITAS Y AGENDA MÉDICA IA (DID 4000 -> Doctores 4001, 4002, 4003)
; -------------------------------------------------------------------------
exten => 4,1,NoOp(>>> OPCION 4 SELECCIONADA: AGENTE DE CITAS Y AGENDA PARA ${CALLERID(num)} <<<)
 same => n,Goto(ivr-opcion-citas,s,1)

exten => i,1,NoOp(>>> TECLA INVALIDA PULSADA POR ${CALLERID(num)} <<<)
 same => n,Playback(opcion-invalida)
 same => n,Goto(s,reproducir)

exten => t,1,NoOp(>>> TIMEOUT: NO SE DETECTARON DIGITOS <<<)
 same => n,Playback(tiempo-agotado-transfiriendo)
 same => n,Goto(ivr-opcion-ventas-agente,s,1)


; =========================================================================
; CONTEXTO 3: [ivr-opcion-saldo] - Consulta de Saldo Dinámica & Transferencia
; =========================================================================
[ivr-opcion-saldo]
exten => s,1,NoOp(>>> CONSULTA DE SALDO: ES_CLIENTE=${ES_CLIENTE}, CALLERID=${CALLERID(num)} <<<)
 same => n,Set(CHANNEL(hangup_handler_push)=sub-limpieza-canal,s,1)
 same => n,GotoIf($["${ES_CLIENTE}" = "1"]?saldo_directo:pedir_tarjeta)

 same => n(saldo_directo),NoOp(>>> CLIENTE RECONOCIDO: ENTREGANDO SALDO DIRECTO <<<)
 same => n,AGI(/var/lib/asterisk/agi-bin/consultar_saldo_rest.py,DIRECTO,${CALLERID(num)})
 same => n,GotoIf($["${TRANSFERIR_HUMANO}" = "1"]?transferir_saldo)
 same => n,Wait(1)
 same => n,Hangup()

 same => n(pedir_tarjeta),NoOp(>>> LEAD DESCONOCIDO: SOLICITANDO TARJETA POR DTMF <<<)
 same => n,Read(DIGITOS_TARJETA,ivr-solicitar-tarjeta,16,,,10)
 same => n,AGI(/var/lib/asterisk/agi-bin/consultar_saldo_rest.py,${DIGITOS_TARJETA},${CALLERID(num)})
 same => n,GotoIf($["${TRANSFERIR_HUMANO}" = "1"]?transferir_saldo)
 same => n,Wait(1)
 same => n,Hangup()

 same => n(transferir_saldo),NoOp(>>> TRANSFERENCIA A AGENTES DE SALDO Y FINANZAS (1001, 1002) <<<)
 same => n,Playback(transfiriendo-con-un-ejecutivo)
 same => n,Dial(PJSIP/1001&PJSIP/1002,30,tTgb(sub-pre-dial^s^1))
 same => n,Hangup()


; =========================================================================
; CONTEXTO 4: [ivr-opcion-cancelacion] - Cancelaciones (Especialistas Ext. 2001, 2002)
; =========================================================================
[ivr-opcion-cancelacion]
exten => s,1,NoOp(>>> GESTION DE CANCELACION PARA CALLER_ID: ${CALLERID(num)} <<<)
 same => n,Set(CHANNEL(hangup_handler_push)=sub-limpieza-canal,s,1)
 same => n,AGI(/var/lib/asterisk/agi-bin/cancelar_tarjeta_rest.py,${CALLERID(num)})
 same => n,GotoIf($["${TRANSFERIR_HUMANO}" = "1"]?transferir_cancelaciones)
 same => n,Wait(1)
 same => n,Hangup()

 same => n(transferir_cancelaciones),NoOp(>>> TRANSFERENCIA A AGENTE ESPECIALISTA EN RETENCION (2001, 2002) <<<)
 same => n,Dial(PJSIP/2001&PJSIP/2002,30,tTgb(sub-pre-dial^s^1))
 same => n,Hangup()


; =========================================================================
; CONTEXTO 5: [ivr-opcion-ventas-agente] - Ventas (Ejecutivos Ext. 3001, 3002)
; =========================================================================
[ivr-opcion-ventas-agente]
exten => s,1,NoOp(>>> TRANSFERENCIA A CAMPAÑA VENTAS (DID 3000 -> AGENTES 3001, 3002) <<<)
 same => n,Set(CHANNEL(hangup_handler_push)=sub-limpieza-canal,s,1)
 same => n,Playback(transfiriendo-con-un-ejecutivo)
 same => n,Dial(PJSIP/3001&PJSIP/3002,30,tTgb(sub-pre-dial^s^1))
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?ocupado:no_responde)

 same => n(ocupado),Playback(agentes-ocupados-intente-mas-tarde)
 same => n,Hangup()

 same => n(no_responde),Playback(agentes-no-disponibles)
 same => n,Hangup()


; =========================================================================
; CONTEXTO 6: [ivr-opcion-citas] - Citas Médicas IA & Doctores (Ext. 4001-4003)
; =========================================================================
[ivr-opcion-citas]
exten => s,1,NoOp(>>> INICIANDO AGENTE IA DE CITAS Y AGENDA PARA CALLER_ID: ${CALLERID(num)} <<<)
 same => n,Set(CHANNEL(hangup_handler_push)=sub-limpieza-canal,s,1)
 same => n,AGI(/var/lib/asterisk/agi-bin/agente_citas_gemini.py,${CALLERID(num)})
 same => n,GotoIf($["${TRANSFERIR_HUMANO}" = "1"]?transferir_doctor)
 same => n,Wait(1)
 same => n,Hangup()

 same => n(transferir_doctor),NoOp(>>> TRANSFERENCIA DIRECTA A DOCTOR / ESPECIALISTA MEDICO (4001, 4002, 4003) <<<)
 same => n,Dial(PJSIP/4001&PJSIP/4002&PJSIP/4003,30,tTgb(sub-pre-dial^s^1))
 same => n,Hangup()


; =========================================================================
; CONTEXTO 7: [from-trunk] - Llamadas entrantes desde Troncal PSTN
; =========================================================================
[from-trunk]
exten => _.,1,NoOp(>>> LLAMADA PSTN ENTRANTE HACIA DID ${EXTEN} DE ${CALLERID(all)} <<<)
 same => n,Set(CHANNEL(hangup_handler_push)=sub-limpieza-canal,s,1)
 same => n,Set(DID_DESTINO=${EXTEN})
 same => n,GotoIf($[${DIALPLAN_EXISTS(from-internal,${EXTEN},1)}]?from-internal,${EXTEN},1)
 same => n,NoOp(>>> [TRUNK-FALLBACK] DID ${EXTEN} sin regla directa, derivando a Cabecera Principal 8000 <<<)
 same => n,Set(DID_DESTINO=8000)
 same => n,Goto(from-internal,8000,1)

exten => s,1,NoOp(>>> LLAMADA PSTN SIN EXTENSION ESPECIFICA (s) DE ${CALLERID(all)} <<<)
 same => n,Set(CHANNEL(hangup_handler_push)=sub-limpieza-canal,s,1)
 same => n,Set(DID_DESTINO=8000)
 same => n,Goto(from-internal,8000,1)
