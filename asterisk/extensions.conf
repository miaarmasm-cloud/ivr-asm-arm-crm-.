; =========================================================================
; DIALPLAN DINÁMICO AGNÓSTICO (ASTERISK 20)
; Toda la lógica de menú, saldo, opciones y DTMF se delega al Middleware
; =========================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]

[from-internal]
; 1. Si alguien marca al IVR principal (ej. 8000 o cualquier número)
exten => 8000,1,NoOp(--- INICIANDO SESION IVR PARA ${CALLERID(num)} ---)
 same => n,Answer(500)
 ; Opción A: Delegar a Stasis (ARI) conectado al Middleware FastAPI
 same => n,Stasis(ivr_agent,${CALLERID(num)})
 same => n,Hangup()

; 2. Enrutamiento directo entre extensiones de prueba (ej. 1001 a 2001)
exten => _[1-2]XXX,1,NoOp(Llamada directa de ${CALLERID(num)} hacia ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; 3. Regla comodín para desviar llamadas entrantes al Middleware
exten => _X.,1,NoOp(Llamada entrante generica ${EXTEN})
 same => n,Goto(from-internal,8000,1)

[from-trunk]
; Cuando se conecte la troncal SIP PSTN real en Fase 2
exten => _.,1,NoOp(Llamada desde PSTN: ${CALLERID(num)})
 same => n,Goto(from-internal,8000,1)
