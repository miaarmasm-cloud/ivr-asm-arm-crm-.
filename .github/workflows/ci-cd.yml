name: CI/CD Pipeline - IVR ARM & CRM

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_AGENT: ${{ github.repository }}/livekit-arm-agent
  IMAGE_NAME_CRM: ${{ github.repository }}/crm-arm-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Empaquetar y publicar Contenedor del Agente LiveKit Python
      - name: Build and Push LiveKit Agent Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./livekit-agent
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_AGENT }}:latest

      # 2. Empaquetar y publicar Contenedor del CRM Next.js
      - name: Build and Push CRM Next.js Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./crm-nextjs
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_CRM }}:latest

      - name: Notification
        run: echo "Contenedores Docker empaquetados y publicados en GHCR exitosamente."
